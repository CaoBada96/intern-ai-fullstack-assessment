openapi: 3.0.3
info:
  title: flash-sale — minimal required contract
  version: "1.0"
  description: Response thành công bọc trong { "data": ... }; lỗi theo { "error": { code, message, details } }.
paths:
  /api/health:
    get:
      responses:
        "200": { description: "{ status: ok, commit: <sha> }" }
  /api/products:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /api/products/{productId}:
    get:
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { description: Error }
  /api/orders:
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, customerName, customerPhone, address]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      quantity: { type: integer, minimum: 1, maximum: 5 }
                customerName: { type: string }
                customerPhone: { type: string }
                address: { type: string }
                couponCode: { type: string }
      responses:
        "201":
          description: "data: Order + accessToken"
        "400": { description: Error }
        "409": { description: "OUT_OF_STOCK (details.productIds) / COUPON_EXHAUSTED" }
        "422": { description: Error }
  /api/orders/{orderId}:
    get:
      security: [{ token: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "401": { description: Error }
        "404": { description: Error }
  /api/orders/{orderId}/cancel:
    post:
      security: [{ token: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "data: Order (status cancelled)" }
        "409": { description: Error }
components:
  securitySchemes:
    token: { type: http, scheme: bearer }
  schemas:
    Product:
      type: object
      required: [id, name, price, currentPrice, stock]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        salePrice: { type: integer, nullable: true }
        currentPrice: { type: integer, description: "Giá áp dụng tại thời điểm gọi API" }
        saleStartsAt: { type: string, format: date-time, nullable: true }
        saleEndsAt: { type: string, format: date-time, nullable: true }
        stock: { type: integer }
    Order:
      type: object
      required: [id, status, items, subtotal, discount, shippingFee, total]
      properties:
        id: { type: string }
        status: { type: string, enum: [placed, cancelled, shipped] }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              quantity: { type: integer }
              unitPrice: { type: integer }
              lineTotal: { type: integer }
        subtotal: { type: integer }
        discount: { type: integer }
        shippingFee: { type: integer }
        total: { type: integer }
        accessToken: { type: string, description: "Chỉ có trong response tạo đơn" }
